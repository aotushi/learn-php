name: learn-php

x-php-image: &php-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: learn-php:8.4

x-php-environment: &php-environment
  APP_ENV: local
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-learning}
  DB_USERNAME: ${MYSQL_USER:-learnphp}
  DB_PASSWORD: ${MYSQL_PASSWORD:-learnphp-local-only}
  DB_NAME: ${MYSQL_DATABASE:-learning}
  DB_USER: ${MYSQL_USER:-learnphp}
  DB_PASS: ${MYSQL_PASSWORD:-learnphp-local-only}
  VALKEY_HOST: valkey
  VALKEY_PORT: 6379

services:
  php:
    <<: *php-image
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      <<: *php-environment
      XDEBUG_MODE: "off"
    volumes:
      - ./:/workspace

  web:
    <<: *php-image
    profiles: ["web"]
    working_dir: /workspace
    command: ["php", "-S", "0.0.0.0:8000", "-t", "stages/03-web-security/public"]
    environment:
      <<: *php-environment
      XDEBUG_MODE: "off"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8000"
    volumes:
      - ./:/workspace

  thinkphp:
    <<: *php-image
    profiles: ["thinkphp", "frontend"]
    working_dir: /workspace/stages/07-thinkphp-foundation/app
    command: ["php", "think", "run", "--host=0.0.0.0", "--port=8000"]
    environment:
      <<: *php-environment
      APP_DEBUG: "false"
      XDEBUG_MODE: "off"
    ports:
      - "127.0.0.1:${THINKPHP_HOST_PORT:-18081}:8000"
    volumes:
      - ./:/workspace
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  node:
    image: node:22-bookworm-slim
    profiles: ["frontend"]
    working_dir: /workspace/stages/06-linux-frontend
    command: ["sleep", "infinity"]
    volumes:
      - ./:/workspace
      - frontend-modules:/workspace/stages/06-linux-frontend/node_modules

  frontend:
    image: node:22-bookworm-slim
    profiles: ["frontend"]
    working_dir: /workspace/stages/06-linux-frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://thinkphp:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-15173}:5173"
    volumes:
      - ./:/workspace
      - frontend-modules:/workspace/stages/06-linux-frontend/node_modules
    depends_on:
      thinkphp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    profiles: ["data", "thinkphp", "frontend", "magento"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning}
      MYSQL_USER: ${MYSQL_USER:-learnphp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnphp-local-only}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13307}:3306"
    volumes:
      - mysql84-data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/10-learning.sh:ro
      - ./docker/mysql/init.sql:/opt/learning.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  valkey:
    image: valkey/valkey:8.1-alpine
    profiles: ["cache", "magento"]
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6380}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.0.0
    profiles: ["magento"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${OPENSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  rabbitmq:
    image: rabbitmq:4.3-management
    profiles: ["magento"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-magento}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-magento-local-only}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12

  magento-php:
    <<: *php-image
    profiles: ["magento"]
    working_dir: /var/www/html
    command: ["php-fpm", "-F"]
    environment:
      XDEBUG_MODE: "off"
    volumes:
      - ./stages/10-magento-foundation/app:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.30-alpine
    profiles: ["magento"]
    ports:
      - "127.0.0.1:${MAGENTO_HOST_PORT:-8088}:80"
    volumes:
      - ./stages/10-magento-foundation/app:/var/www/html:ro
      - ./docker/nginx/magento.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - magento-php
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  frontend-modules:
  mysql84-data:
  valkey-data:
  opensearch-data:
  rabbitmq-data:
