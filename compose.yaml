# 第一阶段主线：首次准备完成后，docker compose up -d --wait 即可启动。
name: learn-php

x-php-image: &php-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: learn-php:8.4

x-php-environment: &php-environment
  APP_ENV: local
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-learning}
  DB_USERNAME: ${MYSQL_USER:-learnphp}
  DB_PASSWORD: ${MYSQL_PASSWORD:-learnphp-local-only}
  DB_NAME: ${MYSQL_DATABASE:-learning}
  DB_USER: ${MYSQL_USER:-learnphp}
  DB_PASS: ${MYSQL_PASSWORD:-learnphp-local-only}

services:
  php:
    <<: *php-image
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      <<: *php-environment
      XDEBUG_MODE: "off"
    volumes:
      - ./:/workspace

  # 原生网页也提供数据库查询，因此等待 MySQL 就绪。
  web:
    <<: *php-image
    working_dir: /workspace
    command: ["php", "-S", "0.0.0.0:8000", "-t", "stages/03-web-security/public"]
    environment:
      <<: *php-environment
      XDEBUG_MODE: "off"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8000"
    volumes:
      - ./:/workspace
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12

  thinkphp:
    <<: *php-image
    working_dir: /workspace/stages/07-thinkphp-foundation/app
    command: ["php", "think", "run", "--host=0.0.0.0", "--port=8000"]
    environment:
      <<: *php-environment
      APP_DEBUG: "false"
      XDEBUG_MODE: "off"
    ports:
      - "127.0.0.1:${THINKPHP_HOST_PORT:-18081}:8000"
    volumes:
      - ./:/workspace
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 仅供安装依赖和构建时使用，不属于日常常驻服务。
  node:
    profiles: ["tools"]
    image: node:22-bookworm-slim
    working_dir: /workspace/stages/06-linux-frontend
    command: ["sleep", "infinity"]
    volumes:
      - ./:/workspace
      - frontend-modules:/workspace/stages/06-linux-frontend/node_modules

  frontend:
    image: node:22-bookworm-slim
    working_dir: /workspace/stages/06-linux-frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://thinkphp:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-15173}:5173"
    volumes:
      - ./:/workspace
      - frontend-modules:/workspace/stages/06-linux-frontend/node_modules
    depends_on:
      thinkphp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-learning}
      MYSQL_USER: ${MYSQL_USER:-learnphp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-learnphp-local-only}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13307}:3306"
    volumes:
      - mysql84-data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/10-learning.sh:ro
      - ./docker/mysql/init.sql:/opt/learning.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  frontend-modules:
  mysql84-data:
