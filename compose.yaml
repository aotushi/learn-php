name: learn-php

x-php-image: &php-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: learn-php:8.4

x-php-environment: &php-environment
  APP_ENV: local
  DB_HOST: mariadb
  DB_PORT: 3306
  DB_DATABASE: learning
  DB_USERNAME: ${MARIADB_USER:-magento}
  DB_PASSWORD: ${MARIADB_PASSWORD:-magento-local-only}
  VALKEY_HOST: valkey
  VALKEY_PORT: 6379

services:
  php:
    <<: *php-image
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      <<: *php-environment
      XDEBUG_MODE: "off"
    volumes:
      - ./:/workspace

  web:
    <<: *php-image
    profiles: ["web"]
    working_dir: /workspace
    command: ["php", "-S", "0.0.0.0:8000", "-t", "stages/03-web-security/public"]
    environment:
      <<: *php-environment
      XDEBUG_MODE: "off"
    ports:
      - "${WEB_HOST_PORT:-8080}:8000"
    volumes:
      - ./:/workspace

  node:
    image: node:22-bookworm-slim
    profiles: ["frontend"]
    working_dir: /workspace/stages/06-linux-frontend
    command: ["sleep", "infinity"]
    volumes:
      - ./:/workspace

  mariadb:
    image: mariadb:11.4
    profiles: ["data", "magento"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root-local-only}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-magento}
      MARIADB_USER: ${MARIADB_USER:-magento}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-magento-local-only}
    ports:
      - "${MARIADB_HOST_PORT:-13307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/10-learning.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8.1-alpine
    profiles: ["data", "magento"]
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_HOST_PORT:-6380}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.0.0
    profiles: ["magento"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  rabbitmq:
    image: rabbitmq:4.2-management
    profiles: ["magento"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-magento}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-magento-local-only}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12

  magento-php:
    <<: *php-image
    profiles: ["magento"]
    working_dir: /var/www/html
    command: ["php-fpm", "-F"]
    environment:
      XDEBUG_MODE: "off"
    volumes:
      - ./stages/07-magento-foundation/app:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    profiles: ["magento"]
    ports:
      - "${MAGENTO_HOST_PORT:-8088}:80"
    volumes:
      - ./stages/07-magento-foundation/app:/var/www/html:ro
      - ./docker/nginx/magento.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - magento-php
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  mariadb-data:
  valkey-data:
  opensearch-data:
  rabbitmq-data:
