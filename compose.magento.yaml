# 第二阶段独立环境；先按手册准备 Magento，再用 -f 指定本文件。
name: learn-php-magento

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MAGENTO_MYSQL_ROOT_PASSWORD:-root-local-only}
      MYSQL_DATABASE: ${MAGENTO_MYSQL_DATABASE:-magento}
      MYSQL_USER: ${MAGENTO_MYSQL_USER:-magento}
      MYSQL_PASSWORD: ${MAGENTO_MYSQL_PASSWORD:-magento-local-only}
    ports:
      - "127.0.0.1:${MAGENTO_MYSQL_HOST_PORT:-13308}:3306"
    volumes:
      - mysql84-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6380}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.0.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${OPENSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-magento}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-magento-local-only}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12

  magento-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: learn-php:8.4
    working_dir: /var/www/html
    command: ["php-fpm", "-F"]
    environment:
      XDEBUG_MODE: "off"
    volumes:
      - ./stages/10-magento-foundation/app:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:${MAGENTO_HOST_PORT:-8088}:80"
    volumes:
      - ./stages/10-magento-foundation/app:/var/www/html:ro
      - ./docker/nginx/magento.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - magento-php
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  mysql84-data:
  valkey-data:
  opensearch-data:
  rabbitmq-data:
